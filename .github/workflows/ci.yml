name: ci
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: python -m py_compile llm_doctor.py tests/test_llm_doctor.py
      - name: Run unit tests
        run: python -m unittest -v tests.test_llm_doctor
      - name: Smoke-test CLI help
        run: python llm_doctor.py --help
